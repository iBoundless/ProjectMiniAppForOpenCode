[project]
name = "ocbot-web"
version = "0.1.0"
description = "OpenCode Mini App backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    # Коммит бота, на который опирается Mini App. Обновлять осознанно.
    "ocbot @ git+https://github.com/iBoundless/opencode-telegram-bot@cbec8b93c5ababbc59f19b86c2e1e1da977e3a30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocbot_web"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
